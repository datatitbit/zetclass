  <script>
    // ---- Which mode is this copy of the app running in? ----
    //  * LIVE SERVICE (zetclass.com): real accounts on the server. Schools sign up,
    //    get their own web address, and their data is stored in the MySQL database.
    //  * Everywhere else (the free Render copy, a file on someone's computer):
    //    the one-school, browser-only DEMO. Nothing is sent anywhere.
    // To try the real service on your own machine, open any page once with
    // ?api=1 on the end (e.g. http://127.0.0.1:8081/?api=1); ?api=0 switches it back.
    (function () {
      var host = location.hostname, qs = location.search, flag = null;
      try {
        if (/[?&]api=1\b/.test(qs)) sessionStorage.setItem('zc_api', '1');
        if (/[?&]api=0\b/.test(qs)) sessionStorage.setItem('zc_api', '0');
        flag = sessionStorage.getItem('zc_api');
      } catch (e) { /* storage blocked: fall back to the default for this host */ }
      var live = /^(www\.)?zetclass\.com$/i.test(host);
      // The API sits at the site's root: an ABSOLUTE path, so it still resolves on
      // school addresses like /st-marys-school/students.
      window.DB_CONFIG = { useApi: flag === '1' || (live && flag !== '0'), apiBase: '/api/index.php' };
    })();

    // How schools reach YOU about subscribing or forgotten passwords. Shown on the
    // sign-in and subscription screens. Leave a value empty to hide it.
    window.ZETCLASS_CONTACT = {
      whatsapp: '+233 55 23 23 233',
      phone: '055 232 3333',
      email: 'zetranovalink@gmail.com',
      momo: { number: '0597558305', merchantId: '220023' }
    };
  </script>
